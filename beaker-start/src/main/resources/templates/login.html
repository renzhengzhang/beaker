<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Beaker 系统</title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link href="https://lf9-cdn-tos.bytecdntp.com/cdn/expire-1-M/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .login-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            border-color: #6366f1;
        }

        .floating-label {
            transition: all 0.3s ease;
        }

        .floating-label.active {
            transform: translateY(-1.5rem);
            font-size: 0.75rem;
            color: #6366f1;
        }
    </style>
</head>

<body class="login-bg min-h-screen flex items-center justify-center p-4">
    <!-- 背景装饰 -->
    <div class="absolute inset-0 overflow-hidden">
        <div
            class="absolute -top-40 -right-32 w-80 h-80 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-pulse">
        </div>
        <div
            class="absolute -bottom-40 -left-32 w-80 h-80 bg-blue-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-pulse animation-delay-2000">
        </div>
        <div
            class="absolute top-40 left-40 w-80 h-80 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-pulse animation-delay-4000">
        </div>
    </div>

    <div class="relative z-10 w-full max-w-md">
        <!-- 登录卡片 -->
        <div class="glass-effect p-8 rounded-2xl shadow-2xl">
            <!-- 标题区域 -->
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="fas fa-flask text-3xl text-indigo-600"></i>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">欢迎回来</h1>
                <p class="text-blue-100">请登录您的账户</p>
                <p class="text-xs text-blue-200 mt-2" th:if="${currentTime}" th:text="${'当前时间: ' + currentTime}"></p>
            </div>

            <!-- 消息提示区域 -->
            <!-- Spring Security 标准错误处理 - 使用国际化异常消息 -->
            <div th:if="${param.error != null or error != null}"
                class="mb-6 p-4 bg-red-500 bg-opacity-20 border border-red-400 text-red-100 rounded-lg backdrop-blur-sm">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-triangle mr-2"></i>
                    <!-- 直接使用Spring Security的国际化异常消息 -->
                    <span th:text="${session.SPRING_SECURITY_LAST_EXCEPTION?.message ?: '用户名或密码错误，请重试'}">
                        登录失败
                    </span>
                </div>
            </div>

            <!-- 登出成功信息 -->
            <div th:if="${param.logout != null or logout != null}"
                class="mb-6 p-4 bg-green-500 bg-opacity-20 border border-green-400 text-green-100 rounded-lg backdrop-blur-sm">
                <div class="flex items-center">
                    <i class="fas fa-check-circle mr-2"></i>
                    <span>您已成功登出</span>
                </div>
            </div>

            <!-- 登录表单 -->
            <form th:action="@{/login}" method="post" class="space-y-6">
                <!-- 隐藏的 redirect 参数 -->
                <input type="hidden" th:if="${param.redirect}" name="redirect" th:value="${param.redirect}" />

                <!-- 用户名输入 -->
                <div class="relative">
                    <input type="text" id="username" name="username" required
                        class="w-full pl-12 pr-4 py-3 bg-white bg-opacity-20 border border-white border-opacity-30 rounded-lg text-white placeholder-blue-100 input-focus focus:outline-none focus:bg-opacity-30"
                        placeholder="请输入用户名" autocomplete="username">
                    <div class="absolute left-4 top-3">
                        <i class="fas fa-user text-blue-200"></i>
                    </div>
                </div>

                <!-- 密码输入 -->
                <div class="relative">
                    <input type="password" id="password" name="password" required
                        class="w-full pl-12 pr-12 py-3 bg-white bg-opacity-20 border border-white border-opacity-30 rounded-lg text-white placeholder-blue-100 input-focus focus:outline-none focus:bg-opacity-30"
                        placeholder="请输入密码" autocomplete="current-password">
                    <div class="absolute left-4 top-3">
                        <i class="fas fa-lock text-blue-200"></i>
                    </div>
                    <button type="button" id="togglePassword"
                        class="absolute right-4 top-3 text-blue-200 hover:text-white focus:outline-none">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>

                <!-- 记住我 -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center text-white">
                        <input type="checkbox" id="remember-me" name="remember-me"
                            class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500 focus:ring-2">
                        <span class="ml-2 text-sm">记住我</span>
                    </label>
                    <a href="#" class="text-sm text-blue-200 hover:text-white transition-colors">
                        忘记密码？
                    </a>
                </div>

                <!-- 登录按钮 -->
                <button type="submit"
                    class="w-full bg-white text-indigo-600 py-3 px-6 rounded-lg font-semibold hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-transparent transition-all duration-200 transform hover:scale-105">
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    登录
                </button>
            </form>

            <!-- 底部链接 -->
            <div class="mt-8 text-center space-y-4">
                <div class="flex items-center justify-center space-x-4 text-sm text-blue-100">
                    <a th:href="@{/}" class="hover:text-white transition-colors">
                        <i class="fas fa-home mr-1"></i>
                        首页
                    </a>
                    <span>|</span>
                    <a th:href="@{/test/jwt}" class="hover:text-white transition-colors">
                        <i class="fas fa-code mr-1"></i>
                        Jwt Token 测试
                    </a>
                </div>

                <!-- 语言切换 -->
                <div class="flex items-center justify-center space-x-2 text-xs text-blue-200">
                    <i class="fas fa-globe mr-1"></i>
                    <a th:href="@{/login(lang='zh_CN')}" class="hover:text-white transition-colors"
                        th:classappend="${#locale.toString() == 'zh_CN'} ? 'text-white font-semibold' : ''">
                        中文
                    </a>
                    <span>|</span>
                    <a th:href="@{/login(lang='en')}" class="hover:text-white transition-colors"
                        th:classappend="${#locale.toString() == 'en'} ? 'text-white font-semibold' : ''">
                        English
                    </a>
                </div>

                <p class="text-xs text-blue-200">
                    © 2025 Beaker 系统. 保留所有权利.
                </p>
            </div>
        </div>
    </div>

    <script>
        // 密码显示/隐藏切换
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        });

        // 输入框焦点效果
        document.querySelectorAll('input[type="text"], input[type="password"]').forEach(input => {
            input.addEventListener('focus', function () {
                this.parentElement.style.transform = 'scale(1.02)';
            });

            input.addEventListener('blur', function () {
                this.parentElement.style.transform = 'scale(1)';
            });
        });

        // 添加加载状态
        document.querySelector('form').addEventListener('submit', function () {
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>登录中...';
            submitBtn.disabled = true;
        });
    </script>
</body>

</html>
