<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'JWT Token 测试工具'">JWT Token 测试工具</title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link href="https://lf9-cdn-tos.bytecdntp.com/cdn/expire-1-M/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script th:src="@{/js/auth-helper.js}"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .status-indicator {
            position: relative;
            display: inline-block;
        }

        .status-indicator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -12px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transform: translateY(-50%);
        }

        .status-success::before {
            background-color: #10b981;
            box-shadow: 0 0 6px #10b981;
        }

        .status-error::before {
            background-color: #ef4444;
            box-shadow: 0 0 6px #ef4444;
        }

        .status-warning::before {
            background-color: #f59e0b;
            box-shadow: 0 0 6px #f59e0b;
        }

        .token-display {
            font-family: 'Courier New', monospace;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
        }

        .api-section:hover {
            transform: translateY(-2px);
        }

        .loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="gradient-bg min-h-screen py-8">
    <!-- Thymeleaf 渲染的用户名隐藏域，用于 JS 判断 session 登录状态 -->
    <input type="hidden" id="thymeleaf-username" th:value="${username ?: ''}" />

    <!-- 顶部导航 -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass-card">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-flask text-2xl text-white"></i>
                    <h1 class="text-xl font-bold text-white">JWT 测试工具</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-white text-sm" th:if="${currentTime}" th:text="${currentTime}"></span>

                    <!-- 未登录时显示 -->
                    <a th:if="${username == null}" th:href="@{/login}"
                        class="text-white hover:text-blue-200 transition-colors">
                        <i class="fas fa-sign-in-alt mr-1"></i>登录页面
                    </a>

                    <!-- 已登录时显示 -->
                    <div th:if="${username != null}" class="flex items-center space-x-4">
                        <span class="text-white">
                            <i class="fas fa-user-circle mr-1"></i>
                            <span th:text="${username}"></span>
                        </span>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit"
                                class="text-white hover:text-blue-200 transition-colors bg-transparent border-none cursor-pointer p-0 inline-flex items-center">
                                <i class="fas fa-sign-out-alt mr-1"></i>登出
                            </button>
                        </form>
                    </div>

                    <!-- 通用链接 -->
                    <a th:href="@{/}" class="text-white hover:text-blue-200 transition-colors">
                        <i class="fas fa-home mr-1"></i>首页
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="pt-24 px-4 sm:px-6 lg:px-8">
        <div class="max-w-6xl mx-auto">
            <!-- 页面标题 -->
            <div class="text-center mb-12">
                <h2 class="text-4xl font-bold text-white mb-4" th:text="${pageTitle} ?: 'JWT Token 测试工具'">JWT Token 测试工具
                </h2>
                <p class="text-blue-100 text-lg"
                    th:text="${pageDescription} ?: 'JWT 认证测试页面，默认测试用户 API (/api/user/info)'">
                    JWT 认证测试页面，默认测试用户 API (/api/user/info)</p>
            </div>

            <!-- 状态面板 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="glass-card p-6 rounded-xl">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-blue-100 text-sm">会话登录</p>
                            <p id="loginStatus" class="text-white font-semibold">未登录</p>
                        </div>
                        <i class="fas fa-user-check text-2xl text-blue-300"></i>
                    </div>
                </div>
                <div class="glass-card p-6 rounded-xl">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-blue-100 text-sm">Token 状态</p>
                            <p id="tokenStatus" class="text-white font-semibold">无 Token</p>
                        </div>
                        <i class="fas fa-key text-2xl text-blue-300"></i>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                <!-- 左侧操作面板 -->
                <div class="space-y-8">
                    <!-- 1. JWT 登录 -->
                    <div class="glass-card p-6 rounded-xl">
                        <h3 class="text-xl font-semibold text-white mb-4"><i
                                class="fas fa-sign-in-alt mr-2 text-green-400"></i>JWT 登录</h3>
                        <div class="space-y-4">
                            <div>
                                <label for="username" class="block text-sm font-medium text-blue-100 mb-2">用户名</label>
                                <input type="text" id="username" placeholder="请输入用户名"
                                    class="w-full px-4 py-3 bg-white bg-opacity-20 rounded-lg text-white placeholder-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-400">
                            </div>
                            <div>
                                <label for="password" class="block text-sm font-medium text-blue-100 mb-2">密码</label>
                                <input type="password" id="password" placeholder="请输入密码"
                                    class="w-full px-4 py-3 bg-white bg-opacity-20 rounded-lg text-white placeholder-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-400">
                            </div>
                            <button id="loginBtn"
                                class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition-transform transform hover:scale-105">登录获取
                                Token</button>
                        </div>
                    </div>

                    <!-- 2. 刷新Token (现在由AuthHelper自动处理) -->
                    <div class="glass-card p-6 rounded-xl">
                        <h3 class="text-xl font-semibold text-white mb-4"><i
                                class="fas fa-sync-alt mr-2 text-blue-400"></i>刷新 Token (手动)</h3>
                        <p class="text-blue-200 text-sm mb-4">
                            Access Token 过期后，AuthHelper 会自动刷新。此按钮仅用于手动测试刷新流程。
                            Refresh Token 安全地存储在 HttpOnly Cookie 中，无法被 JS 访问。
                        </p>
                        <button id="refreshBtn"
                            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-transform transform hover:scale-105">手动刷新
                            Token</button>
                    </div>

                    <!-- 3. API 调用 -->
                    <div class="glass-card p-6 rounded-xl">
                        <h3 class="text-xl font-semibold text-white mb-4"><i
                                class="fas fa-code mr-2 text-yellow-400"></i>API 调用测试</h3>
                        <div class="space-y-4">
                            <div>
                                <label for="accessToken" class="block text-sm font-medium text-blue-100 mb-2">Access
                                    Token (由 AuthHelper 管理)</label>
                                <textarea id="accessToken" rows="3" placeholder="登录后将自动填充" readonly
                                    class="w-full px-4 py-3 bg-white bg-opacity-10 rounded-lg text-white token-display"></textarea>
                            </div>
                            <div>
                                <label for="apiUrl" class="block text-sm font-medium text-blue-100 mb-2">API 地址</label>
                                <input type="text" id="apiUrl" value="/api/weather-forecast"
                                    class="w-full px-4 py-3 bg-white bg-opacity-20 rounded-lg text-white placeholder-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-400">
                            </div>
                            <button id="callApiBtn"
                                class="w-full bg-yellow-600 text-white py-3 rounded-lg font-semibold hover:bg-yellow-700 transition-transform transform hover:scale-105">调用
                                API</button>
                        </div>
                    </div>
                </div>

                <!-- 右侧结果面板 -->
                <div class="space-y-8">
                    <div class="glass-card p-6 rounded-xl">
                        <h3 class="text-xl font-semibold text-white mb-4"><i
                                class="fas fa-terminal mr-2 text-purple-400"></i>执行结果</h3>
                        <div class="bg-gray-900 rounded-lg p-4 min-h-96">
                            <pre id="result" class="text-green-400 font-mono text-sm whitespace-pre-wrap">等待操作...</pre>
                        </div>
                    </div>
                    <div class="glass-card p-6 rounded-xl">
                        <h3 class="text-xl font-semibold text-white mb-4"><i
                                class="fas fa-bolt mr-2 text-orange-400"></i>快捷操作</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <button id="clearResultBtn"
                                class="bg-gray-600 text-white py-2 px-4 rounded-lg hover:bg-gray-700">清空结果</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const auth = new AuthHelper();

            // DOM 元素引用
            const ui = {
                usernameInput: document.getElementById('username'),
                passwordInput: document.getElementById('password'),
                accessTokenArea: document.getElementById('accessToken'),
                apiUrlInput: document.getElementById('apiUrl'),
                resultArea: document.getElementById('result'),
                loginBtn: document.getElementById('loginBtn'),
                refreshBtn: document.getElementById('refreshBtn'),
                callApiBtn: document.getElementById('callApiBtn'),
                clearResultBtn: document.getElementById('clearResultBtn'),
                loginStatus: document.getElementById('loginStatus'),
                tokenStatus: document.getElementById('tokenStatus'),
                thymeleafUsername: document.getElementById('thymeleaf-username'),
            };

            // 动态刷新状态栏
            function updateStatusPanel() {
                // 会话登录状态
                const thymeleafUsername = ui.thymeleafUsername.value;
                ui.loginStatus.textContent = thymeleafUsername ? '已登录（会话）' : '未登录';

                // Token 状态
                const token = auth.getAccessToken();
                ui.tokenStatus.textContent = token ? '✅ 有效 Token' : '❌ 无 Token';
                ui.accessTokenArea.value = token || '无';
            }

            // 显示结果
            function showResult(message, isError = false) {
                const timestamp = new Date().toLocaleString();
                let content;
                if (typeof message === 'object') {
                    content = JSON.stringify(message, null, 2);
                } else {
                    content = message;
                }
                ui.resultArea.textContent = `[${timestamp}] ${isError ? '❌' : '✅'}\n${content}`;
                ui.resultArea.className = `font-mono text-sm whitespace-pre-wrap ${isError ? 'text-red-400' : 'text-green-400'}`;
            }

            // 按钮加载状态
            function setButtonLoading(button, isLoading) {
                if (isLoading) {
                    button.disabled = true;
                    button.classList.add('loading');
                } else {
                    button.disabled = false;
                    button.classList.remove('loading');
                }
            }

            // --- 事件监听器 ---

            // 登录
            ui.loginBtn.addEventListener('click', async () => {
                setButtonLoading(ui.loginBtn, true);
                try {
                    const data = await auth.login(ui.usernameInput.value, ui.passwordInput.value);
                    showResult(data);
                } catch (error) {
                    showResult(error.message, true);
                } finally {
                    setButtonLoading(ui.loginBtn, false);
                    updateStatusPanel();
                }
            });

            // 手动刷新
            ui.refreshBtn.addEventListener('click', async () => {
                setButtonLoading(ui.refreshBtn, true);
                try {
                    const data = await auth.refreshToken();
                    showResult({
                        message: 'Token 手动刷新成功',
                        accessToken: data.accessToken
                    });
                } catch (error) {
                    showResult(error.message, true);
                } finally {
                    setButtonLoading(ui.refreshBtn, false);
                    updateStatusPanel();
                }
            });

            // 调用API
            ui.callApiBtn.addEventListener('click', async () => {
                setButtonLoading(ui.callApiBtn, true);
                try {
                    const data = await auth.fetchWithAuth(ui.apiUrlInput.value);
                    showResult(data);
                } catch (error) {
                    showResult(error.message, true);
                } finally {
                    setButtonLoading(ui.callApiBtn, false);
                    updateStatusPanel();
                }
            });

            // 清空结果
            ui.clearResultBtn.addEventListener('click', () => {
                ui.resultArea.textContent = '等待操作...';
                ui.resultArea.className = 'text-green-400 font-mono text-sm whitespace-pre-wrap';
                updateStatusPanel();
            });

            // 初始化函数
            async function initialize() {
                showResult('页面加载，正在初始化认证模块...');
                const sessionRestored = await auth.initializeAuth();
                if (sessionRestored) {
                    showResult('检测到有效会话。');
                } else {
                    showResult('无有效会话，请登录。');
                }
                updateStatusPanel();
            }

            // 初始化
            initialize();
        });
    </script>
</body>

</html>
