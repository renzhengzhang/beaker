<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片上传工具</title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link href="https://lf9-cdn-tos.bytecdntp.com/cdn/expire-1-M/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .token-display {
            font-family: 'Courier New', monospace;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
        }

        .preview-img {
            max-width: 100%;
            max-height: 240px;
            border-radius: 0.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-top: 1rem;
        }

        .upload-area {
            border: 2px dashed #a5b4fc;
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.15);
            transition: border-color 0.2s, background 0.2s;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .upload-area.dragover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.08);
        }

        .upload-icon {
            font-size: 3rem;
            color: #6366f1;
        }

        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .uploaded-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .uploaded-item {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: box-shadow 0.2s;
        }

        .uploaded-item:hover {
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.15);
        }

        .uploaded-thumb {
            width: 96px;
            height: 96px;
            object-fit: cover;
            border-radius: 0.5rem;
            margin-bottom: 0.75rem;
            background: #f3f4f6;
        }

        .copy-btn {
            margin-left: 0.5rem;
            color: #6366f1;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .copy-btn:hover {
            color: #4338ca;
        }
    </style>
</head>

<body class="gradient-bg min-h-screen py-8">
    <!-- 顶部导航 -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass-card">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-flask text-2xl text-white"></i>
                    <h1 class="text-xl font-bold text-white">图片上传工具</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:if="${username == null}" th:href="@{/login}"
                        class="text-white hover:text-blue-200 transition-colors">
                        <i class="fas fa-sign-in-alt mr-1"></i>登录页面
                    </a>
                    <div th:if="${username != null}" class="flex items-center space-x-4">
                        <span class="text-white">
                            <i class="fas fa-user-circle mr-1"></i>
                            <span th:text="${username}"></span>
                        </span>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit"
                                class="text-white hover:text-blue-200 transition-colors bg-transparent border-none cursor-pointer p-0 inline-flex items-center">
                                <i class="fas fa-sign-out-alt mr-1"></i>登出
                            </button>
                        </form>
                    </div>
                    <a th:href="@{/}" class="text-white hover:text-blue-200 transition-colors">
                        <i class="fas fa-home mr-1"></i>首页
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <div class="pt-24 px-4 sm:px-6 lg:px-8">
        <div class="max-w-2xl mx-auto">
            <!-- 页面标题 -->
            <div class="text-center mb-12">
                <h2 class="text-4xl font-bold text-white mb-4">图片上传工具</h2>
                <p class="text-blue-100 text-lg">支持点击、拖拽、文件夹上传，上传后可预览缩略图和复制图片地址</p>
            </div>
            <!-- 上传区域 -->
            <div id="uploadArea" class="upload-area mb-10">
                <i class="fas fa-cloud-upload-alt upload-icon mb-2"></i>
                <div class="text-white text-lg mb-2">点击或拖拽图片到此处上传</div>
                <div class="text-blue-200 text-sm mb-2">支持多选和文件夹上传</div>
                <input id="imageInput" type="file" accept="image/*" multiple webkitdirectory mozdirectory />
            </div>
            <!-- 已上传图片区域 -->
            <div id="uploadedList" class="uploaded-list"></div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const uploadArea = document.getElementById('uploadArea');
            const imageInput = document.getElementById('imageInput');
            const uploadedList = document.getElementById('uploadedList');
            let uploadedImages = [];

            // 拖拽高亮
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            uploadArea.addEventListener('dragleave', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
            });
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });
            // 点击区域触发文件选择
            uploadArea.addEventListener('click', () => {
                imageInput.click();
            });
            // 文件选择
            imageInput.addEventListener('change', function () {
                handleFiles(this.files);
            });
            // 处理文件
            function handleFiles(files) {
                for (let file of files) {
                    if (!file.type.startsWith('image/')) continue;
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        // 模拟生成图片地址（实际应由后端返回）
                        const fakeUrl = e.target.result;
                        uploadedImages.push({
                            name: file.name,
                            url: fakeUrl
                        });
                        renderUploadedList();
                    };
                    reader.readAsDataURL(file);
                }
            }
            // 渲染已上传图片列表
            function renderUploadedList() {
                uploadedList.innerHTML = '';
                if (uploadedImages.length === 0) return;
                uploadedImages.forEach((img, idx) => {
                    const item = document.createElement('div');
                    item.className = 'uploaded-item';
                    item.innerHTML = `
                        <img src="${img.url}" class="uploaded-thumb" alt="缩略图" />
                        <div class="flex items-center mt-2 w-full">
                            <input type="text" class="w-0 flex-1 bg-transparent text-xs text-blue-900 px-1 py-0.5 rounded border border-blue-100 focus:outline-none" readonly value="${img.url}" />
                            <button class="copy-btn" title="复制图片地址"><i class="fas fa-copy"></i></button>
                        </div>
                        <div class="text-xs text-blue-400 mt-1 truncate w-full text-center">${img.name}</div>
                    `;
                    // 复制按钮事件
                    item.querySelector('.copy-btn').addEventListener('click', function () {
                        const input = item.querySelector('input');
                        input.select();
                        document.execCommand('copy');
                        this.innerHTML = '<i class="fas fa-check"></i>';
                        setTimeout(() => {
                            this.innerHTML = '<i class="fas fa-copy"></i>';
                        }, 1000);
                    });
                    uploadedList.appendChild(item);
                });
            }
        });
    </script>
</body>

</html>
